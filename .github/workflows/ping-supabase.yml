name: Ping Supabase

# El plan gratuito de Supabase pausa el proyecto después de 7 días sin actividad en la API.
# Este workflow pega contra la raíz de la API REST cada 3 días para que nunca llegue a
# cumplirse ese plazo. No toca ninguna tabla ni necesita sesión — un GET a /rest/v1/ ya
# cuenta como actividad y no depende de RLS ni de credenciales de usuario.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pegarle a la API REST de Supabase
        run: |
          codigo=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/")
          echo "Respuesta HTTP: $codigo"
          if [[ "$codigo" != 2* ]]; then
            echo "No respondió 2xx — revisar los secrets SUPABASE_URL/SUPABASE_ANON_KEY o si el proyecto está pausado." >&2
            exit 1
          fi
