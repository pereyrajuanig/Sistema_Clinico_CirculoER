name: Ping Supabase

# El plan gratuito de Supabase pausa el proyecto después de 7 días sin actividad en la API.
# Este workflow pega contra la tabla "pacientes" cada 3 días para que nunca llegue a
# cumplirse ese plazo. El gateway de Supabase exige los headers apikey Y Authorization:
# Bearer juntos (solo apikey da 401) — mismo par que manda automáticamente supabase-js.
# OJO: NO pegarle a la raíz /rest/v1/ — Supabase bloquea ese endpoint con la anon key
# (expone el esquema completo, requiere service_role) y devuelve 401 aunque los headers
# estén bien. Por eso se apunta a una tabla real con select=id&limit=1: como RLS exige
# sesión autenticada y esto pega sin loguearse, siempre devuelve 200 con una lista vacía
# — cuenta como actividad, sin exponer ningún dato real ni necesitar la service_role key.
on:
  schedule:
    - cron: '0 12 */3 * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Verificar que los secrets no lleguen vacíos
        run: |
          if [ -z "${{ secrets.SUPABASE_URL }}" ] || [ -z "${{ secrets.SUPABASE_ANON_KEY }}" ]; then
            echo "SUPABASE_URL o SUPABASE_ANON_KEY llegan vacíos a este workflow." >&2
            echo "Si los cargaste como secret de un Environment de GitHub (no como" >&2
            echo "'Repository secret' llano), este job necesita declarar 'environment:'" >&2
            echo "para poder leerlos — o hay que recrearlos como Repository secrets." >&2
            exit 1
          fi

      - name: Pegarle a la API REST de Supabase
        run: |
          respuesta=$(curl -s -w '\n%{http_code}' \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}" \
            "${{ secrets.SUPABASE_URL }}/rest/v1/pacientes?select=id&limit=1")
          codigo=$(echo "$respuesta" | tail -n1)
          cuerpo=$(echo "$respuesta" | sed '$d')
          echo "Respuesta HTTP: $codigo"
          echo "Cuerpo: $cuerpo"
          if [[ "$codigo" != 2* ]]; then
            echo "No respondió 2xx — revisar los secrets SUPABASE_URL/SUPABASE_ANON_KEY o si el proyecto está pausado." >&2
            exit 1
          fi
